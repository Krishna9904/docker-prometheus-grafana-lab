groups:
  - name: infrastructure
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Node Exporter has been unreachable for more than one minute."

      - alert: HighCPUUsage
        expr: |
          100 - (
            avg by(instance) (
              rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])
            ) * 100
          ) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for five minutes."

      - alert: HighMemoryUsage
        expr: |
          (
            1 -
            node_memory_MemAvailable_bytes{job="node"} /
            node_memory_MemTotal_bytes{job="node"}
          ) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85% for five minutes."

      - alert: FilesystemAlmostFull
        expr: |
          (
            1 -
            node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"}
          ) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem usage above 80%"
          description: "A filesystem is above 80% utilization."
